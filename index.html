<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高音質・英単語フラッシュカード</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .card-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1000px;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 250px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            display: flex;
            flex-direction: column;
            user-select: none;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        /* 画像エリアの調整 */
        .card-img-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
            background-color: #f0f0f0;
            flex-shrink: 0;
            overflow: hidden;
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top; 
            display: block;
        }

        .word-box {
            padding: 15px 10px;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fafafa;
            flex-grow: 1;
        }

        /* 通常単語カードのスタイル */
        .normal-word {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .card.reveal .normal-word {
            opacity: 1;
        }

        /* 作曲家カードのスタイル */
        .placeholder-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .placeholder-who {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
        }
        .placeholder-title {
            font-size: 16px;
            font-weight: bold;
            color: #1e66d5;
        }

        .info-text-wrapper {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .card.reveal .placeholder-text {
            display: none;
        }
        .card.reveal .info-text-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 1;
        }

        .composer-name {
            font-size: 15px;
            font-weight: bold;
            color: #2c3e50;
            line-height: 1.3;
        }
        .composer-title {
            font-size: 13px;
            font-weight: bold;
            color: #1e66d5;
            margin-top: 6px;
            line-height: 1.2;
        }

        /* 画家・絵画カード用のスタイル */
        .painter-thinking {
            font-size: 22px;
            font-weight: bold;
            color: #e67e22;
        }
        .painter-title {
            font-size: 15px;
            font-weight: bold;
            color: #2c3e50;
            line-height: 1.3;
        }
        .painter-museum {
            font-size: 13px;
            color: #1e66d5;
            margin-top: 4px;
            line-height: 1.2;
        }
        .painter-artist-info {
            font-size: 15px;
            font-weight: bold;
            color: #2c3e50;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <h1>Tap Click English</h1>
    <p> </p>

    <div class="card-container" id="cardContainer"></div>

    <script>
        // 単語データの管理
        const wordData = [
            {
                word: 'Wake up',
                image: 'images/wake_up.png',
                audio: 'audio/wake_up.mp3'
            },
            {
                word: 'sunny',
                image: 'images/sunny.png',
                audio: 'audio/sunny.mp3'
            },
            {
                word: 'rainy',
                image: 'images/rainy.png',
                audio: 'audio/rainy.mp3'
            },
            {
                word: 'Wash my face.',
                image: 'images/wash_my_face.png',
                audio: 'audio/wash_my_face.mp3'
            },
            {
                word: 'toothbrush',
                image: 'images/toothbrush.png',
                audio: 'audio/toothbrush.mp3'
            },
            {
                word: 'breakfast',
                image: 'images/breakfast.jpg',
                audio: 'audio/breakfast.mp3'
            },
            {
                word: 'school bag',
                image: 'images/school_bag.jpg',
                audio: 'audio/school_bag.mp3'
            },
            {
                word: "I'm leaving!",
                image: "images/i'm_leaving.png",
                audio: "audio/i'm_leaving.mp3"
            },
            {
                word: 'apple',
                image: 'images/apple.jpg',
                audio: 'audio/apple.mp3'
            },
            {
                word: 'cake',
                image: 'images/cake.jpg',
                audio: 'audio/cake.mp3'
            },
            {
                word: 'lion',
                image: 'images/lion.jpg',
                audio: 'audio/lion.mp3'
            },
            {
                word: 'panda',
                image: 'images/panda.jpg',
                audio: 'audio/panda.mp3'
            },
            {
                word: 'airplane',
                image: 'images/airplane.jpg',
                audio: 'audio/airplane.mp3'
            },
            {
                word: 'butter',
                image: 'images/butter.png',
                audio: 'audio/butter.mp3'
            },
            {
                word: 'Good morning',
                image: 'images/good_morning.png',
                audio: 'audio/good_morning.mp3'
            },
            {
                word: 'I got it!',
                image: 'images/i_got_it.png',
                audio: 'audio/i_got_it.mp3'
            },
            // クラシック作曲家カード（バッハ）
            {
                type: 'composer',
                word: "Johann Sebastian Bach (Germany,1685∼1750)",
                subWord: "Toccata and Fugue in D minor, BWV 565",
                delay: 10000,
                image: "images/Bach.jpg",
                audio: "audio/bach_toccata_and_fuggue.mp3"
            },
            // 画家・絵画カード（ゴッホ）
            {
                type: 'painter',
                artistImage: 'images/van_gogh_self_portrai.jpg',
                artistName: 'Vincent van Gogh',
                artistYears: '1853-1890',
                artwork1Image: 'images/van_gogh_sunflowers.jpg',
                artwork1Title: 'Sunflowers',
                artwork1Museum: 'Van Gogh Museum, Amsterdam',
                artwork2Image: 'images/van_gogh_starry_night.jpg',
                artwork2Title: 'The Starry Night',
                artwork2Museum: 'Museum of Modern Art, New York'
            },
            // 追加英単語カード（修正版）
            {
                word: 'aquarium',
                image: 'images/aquarium.jpg',
                audio: 'audio/aquarium.mp3'
            },
            {
                word: 'arm',
                image: 'images/arm.jpg',
                audio: 'audio/arm.mp3'
            },
            {
                word: 'bicycle',
                image: 'images/bicycle.jpg',
                audio: 'audio/bicycle.mp3'
            },
            {
                word: 'butterfly',
                image: 'images/butterfly.jpg',
                audio: 'audio/butterfly.mp3'
            },
            {
                word: 'compass',
                image: 'images/compass.png',
                audio: 'audio/compass.mp3'
            },
            {
                word: 'face',
                image: 'images/face.jpg',
                audio: 'audio/face.mp3'
            },
            {
                word: 'fried egg',
                image: 'images/fried_egg.jpg',
                audio: 'audio/fried_egg.mp3'
            },
            {
                word: 'green',
                image: 'images/green.jpg',
                audio: 'audio/green.mp3'
            },
            {
                word: 'library',
                image: 'images/library.jpg',
                audio: 'audio/library.mp3'
            },
            {
                word: 'living room',
                image: 'images/living_room.jpg',
                audio: 'audio/living_room.mp3'
            },
            {
                word: 'pear',
                image: 'images/pear.jpg',
                audio: 'audio/pear.mp3'
            },
            {
                word: 'science class',
                image: 'images/science_class.jpg',
                audio: 'audio/science_class.mp3'
            },
            {
                word: 'shoulder',
                image: 'images/shoulder.jpg',
                audio: 'audio/shoulder.mp3'
            },
            {
                word: 'stairs',
                image: 'images/stairs.jpg',
                audio: 'audio/stairs.mp3'
            },
            {
                word: 'street and buildings',
                image: 'images/street_and_buildings.jpg',
                audio: 'audio/street_and_buildings.mp3'
            },
            {
                word: 'sunset',
                image: 'images/sunset.jpg',
                audio: 'audio/sunset.mp3'
            },
            {
                word: 'tongue',
                image: 'images/tongue.jpg',
                audio: 'audio/tongue.mp3'
            },
            {
                word: 'watch',
                image: 'images/watch.jpg',
                audio: 'audio/watch.mp3'
            },
            {
                word: 'white horse',
                image: 'images/white_horse.jpg',
                audio: 'audio/white_horse.mp3'
            },
            {
                word: 'yellow',
                image: 'images/yellow.jpg',
                audio: 'audio/yellow.mp3'
            },
            // クラシック作曲家カード（ベートーヴェン）
            {
                type: 'composer',
                word: "Ludwig van Beethoven (Germany,1770~1827)",
                subWord: "Symphony No.5 in C minor, Op.67",
                delay: 20000,
                image: "images/Ludwig_van_Beethoven.png",
                audio: "audio/Beethoven_symphony_no.5.mp3"
            }
        ];

        const container = document.getElementById('cardContainer');
        let currentAudio = null;
        let activeTimer = null;

        wordData.forEach(data => {
            const card = document.createElement('div');
            card.className = 'card';
            
            if (data.type === 'composer') {
                // 【作曲家カード】
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${data.image}" alt="${data.word}">
                    </div>
                    <div class="word-box">
                        <div class="placeholder-text">
                            <span class="placeholder-who">Who?</span>
                            <span class="placeholder-title">Title?</span>
                        </div>
                        <div class="info-text-wrapper">
                            <span class="composer-name">${data.word}</span>
                            <span class="composer-title">${data.subWord}</span>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    if (currentAudio) {
                        currentAudio.pause();
                        currentAudio.currentTime = 0;
                    }
                    if (activeTimer) {
                        clearTimeout(activeTimer);
                    }

                    card.classList.remove('reveal');

                    currentAudio = new Audio(data.audio);
                    currentAudio.play().catch(error => {
                        console.log("音声再生エラー:", error);
                    });

                    activeTimer = setTimeout(() => {
                        card.classList.add('reveal');
                    }, data.delay || 10000);
                });

            } else if (data.type === 'painter') {
                // 【画家・絵画カード】
                card.dataset.step = '0'; // 初期状態

                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${data.artistImage}" alt="${data.artistName}">
                    </div>
                    <div class="word-box">
                        <div class="placeholder-text">
                            <span class="placeholder-who">Who?</span>
                            <span class="placeholder-title">Title?</span>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    let step = parseInt(card.dataset.step || '0');

                    // 個別のタイマーがあればクリア
                    if (card.painterTimer) {
                        clearTimeout(card.painterTimer);
                        card.painterTimer = null;
                    }

                    // ステップの更新 (0 -> 1 -> 2 -> 3 -> 1 -> 2 ...)
                    if (step === 0 || step === 3) {
                        step = 1;
                    } else {
                        step++;
                    }
                    card.dataset.step = step;

                    const imgEl = card.querySelector('img');
                    const wordBox = card.querySelector('.word-box');

                    if (step === 1) {
                        // 【Step 1】作品①（ひまわり）
                        imgEl.src = data.artwork1Image;
                        wordBox.innerHTML = `<span class="painter-thinking">???</span>`;

                        card.painterTimer = setTimeout(() => {
                            wordBox.innerHTML = `
                                <span class="painter-title">${data.artwork1Title}</span>
                                <span class="painter-museum">(${data.artwork1Museum})</span>
                            `;
                        }, 5000);

                    } else if (step === 2) {
                        // 【Step 2】作品②（星月夜）
                        imgEl.src = data.artwork2Image;
                        wordBox.innerHTML = `<span class="painter-thinking">???</span>`;

                        card.painterTimer = setTimeout(() => {
                            wordBox.innerHTML = `
                                <span class="painter-title">${data.artwork2Title}</span>
                                <span class="painter-museum">(${data.artwork2Museum})</span>
                            `;
                        }, 5000);

                    } else if (step === 3) {
                        // 【Step 3】画家の肖像画に戻り、画家名(生没年)を表示
                        imgEl.src = data.artistImage;
                        wordBox.innerHTML = `
                            <span class="painter-artist-info">${data.artistName} (${data.artistYears})</span>
                        `;
                    }
                });

            } else {
                // 【通常の英単語カード】
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${data.image}" alt="${data.word}">
                    </div>
                    <div class="word-box">
                        <span class="normal-word">${data.word}</span>
                    </div>
                `;

                card.addEventListener('click', () => {
                    if (currentAudio) {
                        currentAudio.pause();
                        currentAudio.currentTime = 0;
                    }
                    if (activeTimer) {
                        clearTimeout(activeTimer);
                    }

                    currentAudio = new Audio(data.audio);
                    currentAudio.play().catch(error => {
                        console.log("音声再生エラー:", error);
                    });

                    card.classList.toggle('reveal');
                });
            }

            container.appendChild(card);
        });
    </script>
</body>
</html>
