<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クラシック音楽・作曲家カード</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f7f6;
    }
    
    .nav-header {
      margin-bottom: 15px;
    }
    .nav-header a {
      color: #555;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }
    .nav-header a:hover {
      text-decoration: underline;
    }

    .card-container {
      width: 90%;
      max-width: 400px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      cursor: pointer;
      text-align: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .card-image-wrapper {
      width: 100%;
      background-color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card-image-wrapper img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .card-text {
      padding: 20px 10px;
      font-size: 18px;
      font-weight: bold;
      color: #333333;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
      line-height: 1.4;
    }

    .card-text.fade-in {
      opacity: 1;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      gap: 15px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background-color: #4A90E2;
      color: white;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    button:active {
      transform: translateY(2px);
    }
  </style>
</head>
<body>

  <div class="nav-header">
    <a href="../index.html">← 英単語カードへ戻る</a>
  </div>

  <div class="card-container" id="cardContainer">
    <div class="card-image-wrapper">
      <img id="cardImage" src="" alt="カード画像">
    </div>
    <div class="card-text" id="cardText"></div>
  </div>

  <div class="controls">
    <button id="prevBtn">前へ</button>
    <button id="nextBtn">次へ</button>
  </div>

  <script>
    // ==========================================
    // クラシック音楽・作曲家データ（16セット）
    // ==========================================
    const wordData = [
      {
        word: "Wolfgang Amadeus Mozart (Austria,1756∼1791)",
        image: "images/Wolfgang_Amadeus_Mozart.png",
        audio: "audio/Morzart_Eine_Kleine_Nachtmusik_K525.mp3"
      },
      {
        word: "Antonio Vivaldi (Italy,1678–1741)",
        image: "images/Antonio_Vivaldi.jpg",
        audio: "audio/Vivaldi_The_Four_Seasons_spring_1_RV269.mp3"
      },
      {
        word: "Richard Strauss (Germany,1864-1949)",
        image: "images/Richard_Strauss.jpg",
        audio: "audio/Strauss_R_Also_sprach_Zarathustra_Einleitung.mp3"
      },
      {
        word: "Pyotr Ilyich Tchaikovsky (Russia,1840–1893)",
        image: "images/Pyotr_Ilyich_Tchaikovsky.jpg",
        audio: "audio/Tchaikovsky_Piano_Concert_No1_1_Op23.mp3"
      },
      {
        word: "Ludwig van Beethoven (Germany,1770-1827)",
        image: "images/Ludwig_van_Beethoven_2.jpg",
        audio: "audio/Beethoven_Piano_Sonata14_1_op27_2.mp3"
      },
      {
        word: "Wolfgang Amadeus Mozart (Austria,1756∼1791)",
        image: "images/Wolfgang_Amadeus_Mozart_2.jpg",
        audio: "audio/Mozart_The_Marriage_of_Figaro_Overture_KV492.mp3"
      },
      {
        word: "Sergei Rachmaninoff (Russia,1873-1943)",
        image: "images/Sergei_Rachmaninoff.jpg",
        audio: "audio/Rachmaninov_Piano_Concert_No2_1.mp3"
      },
      {
        word: "Ludwig van Beethoven (Germany,1770-1827)",
        image: "images/Ludwig_van_Beethoven_3.jpg",
        audio: "audio/Beethoven_Fur_Elise_Bagatelle_No25.mp3"
      },
      {
        word: "Claude Debussy (France,1862–1918)",
        image: "images/Claude_Debussy.jpg",
        audio: "audio/Debussy_La_fille_aux_cheveux_de_lin.mp3"
      },
      {
        word: "Edward William Elgar (England,1857-1934)",
        image: "images/Edward_William_Elgar.jpg",
        audio: "audio/Holst_Jupiter_the_Bringer_of_Jollity_from_The_Planets_Op32.mp3"
      },
      {
        word: "Johann Strauss II (Austria,1825–1899)",
        image: "images/Johann_Strauss_II.jpg",
        audio: "audio/Johann_Strauss_II_An_der_schonen_blauen_Donau_Op314.mp3"
      },
      {
        word: "Johann Sebastian Bach (Germany,1685–1750)",
        image: "images/Johann_Sebastian_Bach_2.jpg",
        audio: "audio/JS_Bach_Air_on_G_String_Suite_No3_II_Air_BWV1068.mp3"
      },
      {
        word: "Maurice Ravel (France,1875-1937)",
        image: "images/Maurice_Ravel.jpg",
        audio: "audio/Ravel_Bolero_Tempo_di_Bolero_moderato_assai.mp3"
      },
      {
        word: "Edward William Elgar (England,1857-1934)",
        image: "images/Edward_William_Elgar.jpg",
        audio: "audio/Elger_Pomp_and_Circumstance_March_No_1_Op39.mp3"
      },
      {
        word: "Georges Bizet (France,1838∼1875)",
        image: "images/Georges_Bizet.jpg",
        audio: "audio/Bizet_Carmen_Suite_No_1_Final_Les_Toreadors.mp3"
      },
      {
        word: "Pablo de Sarasate (Spain,1844∼1908)",
        image: "images/Pablo_de_Sarasate.jpg",
        audio: "audio/Sarasate_Zigeunerweisen_Op20.mp3"
      }
    ];

    let currentIndex = 0;
    let audioElement = new Audio();

    const cardContainer = document.getElementById('cardContainer');
    const cardImage = document.getElementById('cardImage');
    const cardText = document.getElementById('cardText');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function loadCard(index) {
      const data = wordData[index];
      cardImage.src = data.image;
      cardText.textContent = data.word;
      cardText.classList.remove('fade-in');
      audioElement.src = data.audio;
    }

    function triggerCard() {
      if (!cardText.classList.contains('fade-in')) {
        cardText.classList.add('fade-in');
      }
      audioElement.currentTime = 0;
      audioElement.play().catch(e => console.log("音声再生エラー:", e));
    }

    cardContainer.addEventListener('click', triggerCard);

    prevBtn.addEventListener('click', (e) => {
      e.stopPropagation(); // カードクリックの重複発火防止
      currentIndex = (currentIndex - 1 + wordData.length) % wordData.length;
      loadCard(currentIndex);
    });

    nextBtn.addEventListener('click', (e) => {
      e.stopPropagation(); // カードクリックの重複発火防止
      currentIndex = (currentIndex + 1) % wordData.length;
      loadCard(currentIndex);
    });

    // 初期ロード
    loadCard(currentIndex);
  </script>
</body>
</html>
