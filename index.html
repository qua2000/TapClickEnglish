<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高音質・英単語フラッシュカード</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .card-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1000px;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 280px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            position: relative;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .card-img-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* バッジ（プレート）のスタイル */
        .card-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background-color: rgba(44, 62, 80, 0.85);
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 2;
        }
        .word-box {
            padding: 15px;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fafafa;
        }

        /* 初期プレースホルダー表示（Who? / Title?） */
        .placeholder-text {
            font-size: 16px;
            color: #888;
            font-weight: bold;
            line-height: 1.4;
            transition: opacity 0.3s ease;
        }
        .card.revealed .placeholder-text {
            display: none; /* 10秒後に消す */
        }

        /* 10秒後に表示されるテキスト */
        .info-text-wrapper {
            opacity: 0;
            display: none;
            transition: opacity 0.5s ease;
        }
        .card.revealed .info-text-wrapper {
            display: block;
            opacity: 1; /* 10秒後にフェードイン表示 */
        }

        .word {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            line-height: 1.3;
        }
        .sub-word {
            font-size: 13px;
            color: #666;
            margin-top: 6px;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <h1>Tap Click English</h1>
    <p> </p>

    <div class="card-container" id="cardContainer"></div>

    <script>
        // 単語データの管理
        const wordData = [
            {
                word: 'Wake up',
                image: 'images/wake_up.png',
                audio: 'audio/wake_up.mp3'
            },
            {
                word: 'sunny',
                image: 'images/sunny.png',
                audio: 'audio/sunny.mp3'
            },
            {
                word: 'rainy',
                image: 'images/rainy.png',
                audio: 'audio/rainy.mp3'
            },
            {
                word: 'Wash my face.',
                image: 'images/wash_my_face.png',
                audio: 'audio/wash_my_face.mp3'
            },
            {
                word: 'toothbrush',
                image: 'images/toothbrush.png',
                audio: 'audio/toothbrush.mp3'
            },
            {
                word: 'breakfast',
                image: 'images/breakfast.jpg',
                audio: 'audio/breakfast.mp3'
            },
            {
                word: 'school bag',
                image: 'images/school_bag.jpg',
                audio: 'audio/school_bag.mp3'
            },
            {
                word: "I'm leaving!",
                image: "images/i'm_leaving.png",
                audio: "audio/i'm_leaving.mp3"
            },
            {
                word: 'apple',
                image: 'images/apple.jpg',
                audio: 'audio/apple.mp3'
            },
            {
                word: 'cake',
                image: 'images/cake.jpg',
                audio: 'audio/cake.mp3'
            },
            {
                word: 'lion',
                image: 'images/lion.jpg',
                audio: 'audio/lion.mp3'
            },
            {
                word: 'panda',
                image: 'images/panda.jpg',
                audio: 'audio/panda.mp3'
            },
            {
                word: 'airplane',
                image: 'images/airplane.jpg',
                audio: 'audio/airplane.mp3'
            },
            {
                word: 'butter',
                image: 'images/butter.png',
                audio: 'audio/butter.mp3'
            },
            {
                word: 'Good morning',
                image: 'images/good_morning.png',
                audio: 'audio/good_morning.mp3'
            },
            {
                word: 'I got it!',
                image: 'images/i_got_it.png',
                audio: 'audio/i_got_it.mp3'
            },
            // 作曲家カード（バッハ）
            {
                type: 'composer',
                word: "Johann Sebastian Bach (Germany,1685∼1750)",
                subWord: "Toccata and Fugue in D minor, BWV 565",
                delay: 10000, // 表示までの遅延時間（10秒 = 10000ミリ秒）
                image: "images/Bach.jpg",
                audio: "audio/bach_toccata_and_fuggue.mp3"
            }
        ];

        const container = document.getElementById('cardContainer');
        let currentAudio = null; // 現在再生中の音声を保持
        let activeTimer = null;  // 10秒タイマーの制御用

        // データからHTMLのカードを自動生成する
        wordData.forEach(data => {
            const card = document.createElement('div');
            card.className = 'card';
            
            // クラシック作曲家カードと通常の英単語カードで表示を分岐
            if (data.type === 'composer') {
                // 作曲家カードの場合（Who? / Title? を初期表示）
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${data.image}" alt="${data.word}">
                    </div>
                    <div class="word-box">
                        <div class="placeholder-text">
                            <div>Who?</div>
                            <div>Title?</div>
                        </div>
                        <div class="info-text-wrapper">
                            <div class="word">${data.word}</div>
                            <div class="sub-word">${data.subWord}</div>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    // 他の音声を停止
                    if (currentAudio) {
                        currentAudio.pause();
                        currentAudio.currentTime = 0;
                    }
                    // 動作中のタイマーがあればクリア
                    if (activeTimer) {
                        clearTimeout(activeTimer);
                    }

                    // 再タップ時は一度表示を初期（Who?/Title?）に戻す
                    card.classList.remove('revealed');

                    // 新しい音声を再生
                    currentAudio = new Audio(data.audio);
                    currentAudio.play().catch(error => {
                        console.log("音声再生エラー:", error);
                    });

                    // 指定秒数（10秒）後に文字を表示
                    activeTimer = setTimeout(() => {
                        card.classList.add('revealed');
                    }, data.delay || 10000);
                });

            } else {
                // 通常の英単語カードの場合（既存の動作）
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${data.image}" alt="${data.word}">
                    </div>
                    <div class="word-box">
                        <span class="word">${data.word}</span>
                    </div>
                `;

                card.addEventListener('click', () => {
                    if (currentAudio) {
                        currentAudio.pause();
                        currentAudio.currentTime = 0;
                    }
                    if (activeTimer) {
                        clearTimeout(activeTimer);
                    }

                    currentAudio = new Audio(data.audio);
                    currentAudio.play().catch(error => {
                        console.log("音声再生エラー:", error);
                    });

                    card.classList.toggle('revealed');
                });
            }

            container.appendChild(card);
        });
    </script>
</body>
</html>
