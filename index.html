<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高音質・英単語フラッシュカード</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .card-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1000px;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 250px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        /* 画像エリアの調整（枠からはみ出ないように固定 height: 180px に指定） */
        .card-img-wrapper {
            position: relative;
            width: 100%;
            height: 180px;
            background-color: #eee;
            flex-shrink: 0;
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .word-box {
            padding: 15px 10px;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fafafa;
            flex-grow: 1;
        }

        /* -------------------------------------------
           通常単語カードのスタイル（タップ前は非表示）
        ------------------------------------------- */
        .normal-word {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        /* revealクラスがついた時だけ表示 */
        .card.reveal .normal-word {
            opacity: 1;
        }

        /* -------------------------------------------
           作曲家カードのスタイル
        ------------------------------------------- */
        /* 初期状態：Who? (黒字) / Title? (青字) */
        .placeholder-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .placeholder-who {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50; /* 黒字 */
        }
        .placeholder-title {
            font-size: 16px;
            font-weight: bold;
            color: #1e66d5; /* 青字 */
        }

        /* 10秒後に切り替わるテキスト */
        .info-text-wrapper {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* 10秒経過後（revealクラス付与時）の表示切替 */
        .card.reveal .placeholder-text {
            display: none; /* プレースホルダーを非表示 */
        }
        .card.reveal .info-text-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 1;    /* フェードイン表示 */
        }

        /* 10秒後の名前（黒字）とタイトル（青字） */
        .composer-name {
            font-size: 15px;
            font-weight: bold;
            color: #2c3e50; /* 黒字 */
            line-height: 1.3;
        }
        .composer-title {
            font-size: 13px;
            font-weight: bold;
            color: #1e66d5; /* 青字 */
            margin-top: 6px;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <h1>Tap Click English</h1>
    <p> </p>

    <div class="card-container" id="cardContainer"></div>

    <script>
        // 単語データの管理
        const wordData = [
            {
                word: 'Wake up',
                image: 'images/wake_up.png',
                audio: 'audio/wake_up.mp3'
            },
            {
                word: 'sunny',
                image: 'images/sunny.png',
                audio: 'audio/sunny.mp3'
            },
            {
                word: 'rainy',
                image: 'images/rainy.png',
                audio: 'audio/rainy.mp3'
            },
            {
                word: 'Wash my face.',
                image: 'images/wash_my_face.png',
                audio: 'audio/wash_my_face.mp3'
            },
            {
                word: 'toothbrush',
                image: 'images/toothbrush.png',
                audio: 'audio/toothbrush.mp3'
            },
            {
                word: 'breakfast',
                image: 'images/breakfast.jpg',
                audio: 'audio/breakfast.mp3'
            },
            {
                word: 'school bag',
                image: 'images/school_bag.jpg',
                audio: 'audio/school_bag.mp3'
            },
            {
                word: "I'm leaving!",
                image: "images/i'm_leaving.png",
                audio: "audio/i'm_leaving.mp3"
            },
            {
                word: 'apple',
                image: 'images/apple.jpg',
                audio: 'audio/apple.mp3'
            },
            {
                word: 'cake',
                image: 'images/cake.jpg',
                audio: 'audio/cake.mp3'
            },
            {
                word: 'lion',
                image: 'images/lion.jpg',
                audio: 'audio/lion.mp3'
            },
            {
                word: 'panda',
                image: 'images/panda.jpg',
                audio: 'audio/panda.mp3'
            },
            {
                word: 'airplane',
                image: 'images/airplane.jpg',
                audio: 'audio/airplane.mp3'
            },
            {
                word: 'butter',
                image: 'images/butter.png',
                audio: 'audio/butter.mp3'
            },
            {
                word: 'Good morning',
                image: 'images/good_morning.png',
                audio: 'audio/good_morning.mp3'
            },
            {
                word: 'I got it!',
                image: 'images/i_got_it.png',
                audio: 'audio/i_got_it.mp3'
            },
            // クラシック作曲家カード（バッハ）
            {
                type: 'composer',
                word: "Johann Sebastian Bach (Germany,1685∼1750)",
                subWord: "Toccata and Fugue in D minor, BWV 565",
                delay: 10000, // 10秒後に文字表示
                image: "images/Bach.jpg",
                audio: "audio/bach_toccata_and_fuggue.mp3"
            }
        ];

        const container = document.getElementById('cardContainer');
        let currentAudio = null;
        let activeTimer = null;

        wordData.forEach(data => {
            const card = document.createElement('div');
            card.className = 'card';
            
            if (data.type === 'composer') {
                // 【作曲家カード】
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${data.image}" alt="${data.word}">
                    </div>
                    <div class="word-box">
                        <div class="placeholder-text">
                            <span class="placeholder-who">Who?</span>
                            <span class="placeholder-title">Title?</span>
                        </div>
                        <div class="info-text-wrapper">
                            <span class="composer-name">${data.word}</span>
                            <span class="composer-title">${data.subWord}</span>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    // 音声とタイマーをリセット
                    if (currentAudio) {
                        currentAudio.pause();
                        currentAudio.currentTime = 0;
                    }
                    if (activeTimer) {
                        clearTimeout(activeTimer);
                    }

                    // 再タップ時は初期表示に戻す
                    card.classList.remove('reveal');

                    // 音声再生
                    currentAudio = new Audio(data.audio);
                    currentAudio.play().catch(error => {
                        console.log("音声再生エラー:", error);
                    });

                    // 10秒後に文字を切り替え表示
                    activeTimer = setTimeout(() => {
                        card.classList.add('reveal');
                    }, data.delay || 10000);
                });

            } else {
                // 【通常の英単語カード】
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${data.image}" alt="${data.word}">
                    </div>
                    <div class="word-box">
                        <span class="normal-word">${data.word}</span>
                    </div>
                `;

                card.addEventListener('click', () => {
                    if (currentAudio) {
                        currentAudio.pause();
                        currentAudio.currentTime = 0;
                    }
                    if (activeTimer) {
                        clearTimeout(activeTimer);
                    }

                    currentAudio = new Audio(data.audio);
                    currentAudio.play().catch(error => {
                        console.log("音声再生エラー:", error);
                    });

                    // タップごとに表示/非表示を切り替え
                    card.classList.toggle('reveal');
                });
            }

            container.appendChild(card);
        });
    </script>
</body>
</html>
